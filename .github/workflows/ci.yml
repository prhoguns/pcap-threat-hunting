name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.14", cache: pip }
      - run: pip install -r requirements.txt
      - name: Generate capture
        run: python scripts/generate_pcap.py
      - name: Zeek
        run: docker run --rm -v "$PWD":/app -w /app/zeek zeek/zeek:7.0 zeek -C -r /app/data/traffic.pcap LogAscii::use_json=T
      - name: Hunt and score
        run: |
          python scripts/build_db.py
          python scripts/run.py
          grep -c "| found |" results/SCORECARD.md | grep -q 3
